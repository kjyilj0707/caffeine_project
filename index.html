<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>카페인 측정기</title>
  <link rel="icon" href="icons/icon-192.png" />
  <!-- 홈 화면에 추가하면 앱처럼 열리고 알림을 받을 수 있게 (아이폰은 홈 화면 앱에서만 알림 가능) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="카페인" />
  <meta name="theme-color" content="#6f4e37" />
  <!-- stlite: 브라우저 안에서 Python(Pyodide)으로 Streamlit 앱을 실행 → 서버 없이 GitHub Pages에서 동작 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.css" />
  <style>
    body { margin: 0; background: #ffffff; }
    #loading { font-family: system-ui, sans-serif; color: #52514e; padding: 48px 16px; text-align: center; }
    /* 로그인 바: 한 줄짜리. 로그인·가입은 따로 여는 창(#auth-sheet)에서 */
    /* Streamlit 화면은 자기 상자를 꽉 채우므로, 바를 맨 위에 고정하고 앱 상자(#root)는 바 높이만큼 아래에서 시작 */
    :root { --bar-bg: #f2f2f7; --bar-fg: #1c1c1e; --muted: #8a8a8f; --line: rgba(0,0,0,.1);
            --sheet-bg: #ffffff; --field: #f2f2f7; --acc: #34C759; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bar-bg: #1c1c1e; --bar-fg: #f2f2f7; --muted: #8e8e93; --line: rgba(255,255,255,.12);
                                        --sheet-bg: #1c1c1e; --field: #2c2c2e; color-scheme: dark; }
    }
    #auth-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; box-sizing: border-box;
                font-family: -apple-system, system-ui, sans-serif; font-size: 13px; color: var(--bar-fg);
                background: var(--bar-bg); border-bottom: 1px solid var(--line); padding: 8px 16px;
                display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    #auth-status { flex: 1 1 auto; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #auth-msg { flex-basis: 100%; color: var(--muted); }
    #auth-msg:empty { display: none; }
    #root { position: fixed; top: var(--auth-bar-h, 40px); left: 0; right: 0; bottom: 0; overflow: auto; }
    /* 버튼·입력칸은 글자색·배경색을 직접 정함 (아이폰 다크 모드에서 흰 버튼에 흰 글자가 되는 문제) */
    .pill { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
            background: var(--sheet-bg); color: var(--bar-fg); cursor: pointer; -webkit-appearance: none; }
    .pill.acc { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
    /* 로그인·가입 창 */
    #auth-sheet { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.45); display: flex;
                  align-items: flex-end; justify-content: center; font-family: -apple-system, system-ui, sans-serif; }
    #auth-sheet .card { width: 100%; max-width: 440px; box-sizing: border-box; background: var(--sheet-bg); color: var(--bar-fg);
                        border-radius: 22px 22px 0 0; padding: 18px 20px calc(24px + env(safe-area-inset-bottom)); }
    @media (min-width: 600px) { #auth-sheet { align-items: center; } #auth-sheet .card { border-radius: 22px; } }
    #auth-sheet .head { display: flex; align-items: center; margin-bottom: 14px; }
    #auth-sheet .head h2 { flex: 1; text-align: center; font-size: 17px; margin: 0; }
    #auth-sheet .x { border: 0; background: none; color: var(--muted); font-size: 22px; width: 32px; cursor: pointer; }
    .tabs { display: flex; background: var(--field); border-radius: 10px; padding: 3px; margin-bottom: 16px; }
    .tabs button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-size: 15px; padding: 8px;
                   border-radius: 8px; cursor: pointer; }
    .tabs button.on { background: var(--sheet-bg); color: var(--bar-fg); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .field { display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: 17px; padding: 13px 14px;
             margin-bottom: 10px; border-radius: 12px; border: 1px solid transparent; background: var(--field);
             color: var(--bar-fg); outline: none; -webkit-appearance: none; }
    .field:focus { border-color: var(--acc); }
    .big { display: block; width: 100%; font: inherit; font-size: 17px; font-weight: 600; padding: 14px; margin-top: 6px;
           border: 0; border-radius: 12px; background: var(--acc); color: #fff; cursor: pointer; -webkit-appearance: none; }
    .sub { display: block; width: 100%; margin-top: 12px; border: 0; background: none; color: var(--acc); font: inherit;
           font-size: 14px; cursor: pointer; }
    .note { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 4px 2px 10px; }
    #sheet-msg { font-size: 14px; line-height: 1.45; margin: 10px 2px 0; min-height: 1em; }
    #sheet-msg.err { color: #FF3B30; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- 로그인 바: 로그인은 자바스크립트(supabase-js)가 하고, 결과를 브라우저 속 Python에 파일로 넘긴다 -->
  <div id="auth-bar">
    <span id="auth-status">로그인 확인 중…</span>
    <button id="auth-open" class="pill acc" hidden>로그인 · 가입</button>
    <button id="push-btn" class="pill" hidden>알림 켜기</button>
    <button id="auth-setpw" class="pill" hidden>비밀번호</button>
    <button id="auth-logout" class="pill" hidden>로그아웃</button>
    <span id="auth-msg"></span>
  </div>

  <!-- 로그인 · 회원가입 창: [로그인 | 회원가입] 탭, 메일 코드 단계, 비밀번호 정하기 단계 -->
  <div id="auth-sheet" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="head"><span style="width:32px"></span><h2 id="sheet-title">로그인</h2>
        <button class="x" id="sheet-close" aria-label="닫기">×</button></div>
      <div class="tabs" id="sheet-tabs">
        <button data-tab="login" class="on">로그인</button><button data-tab="signup">회원가입</button>
      </div>
      <form id="step-login">
        <input class="field" id="in-email" type="email" placeholder="이메일" autocomplete="email" required />
        <input class="field" id="in-password" type="password" placeholder="비밀번호" autocomplete="current-password" required />
        <button class="big" type="submit">로그인</button>
        <button class="sub" type="button" id="go-code-login">비밀번호를 잊었어요 · 메일 코드로 로그인</button>
      </form>
      <form id="step-signup" hidden>
        <input class="field" id="up-email" type="email" placeholder="이메일" autocomplete="email" required />
        <input class="field" id="up-password" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="new-password"
               minlength="6" required />
        <p class="note">가입하면 메일로 숫자 코드가 와요. 코드를 한 번 넣으면 끝 — 그다음부터는 이메일과 비밀번호로 로그인해요.</p>
        <button class="big" type="submit">가입하기</button>
        <button class="sub" type="button" id="go-code-signup">비밀번호 없이 · 메일 코드로 가입</button>
      </form>
      <form id="step-code" hidden>
        <p class="note" id="code-note">메일로 보낸 숫자 코드를 넣어 주세요.</p>
        <input class="field" id="in-code" inputmode="numeric" autocomplete="one-time-code" placeholder="숫자 코드"
               style="letter-spacing: 4px; text-align: center; font-size: 22px" required />
        <button class="big" type="submit">확인</button>
        <button class="sub" type="button" id="code-back">← 이메일 다시 입력</button>
      </form>
      <form id="step-setpw" hidden>
        <p class="note">다음부터 이메일 + 비밀번호로 바로 로그인하도록 비밀번호를 정해 주세요.</p>
        <input class="field" id="in-newpw" type="password" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password"
               minlength="6" required />
        <button class="big" type="submit">비밀번호 저장</button>
        <button class="sub" type="button" id="setpw-later">나중에 할게요</button>
      </form>
      <p id="sheet-msg"></p>
    </div>
  </div>
  <div id="root">
    <p id="loading">카페인 측정기를 불러오는 중이에요. 처음엔 10~20초 걸려요…</p>
  </div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js";
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm";

    // ── 로그인 (Step 4-2) ──
    // 공개용 키라 저장소에 있어도 됨: 데이터 보호는 서버의 RLS 규칙(내 데이터는 나만)이 한다
    const SUPABASE_URL = "https://arqruewigqgzbmlsgjad.supabase.co";
    const SUPABASE_KEY = "sb_publishable_d3_p7eyo_DVHwgFvXXMbqw_Z1Pngu2j";
    const SESSION_FILE = ".auth_session.json";  // app/account.py의 SESSION_FILE과 같은 이름
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);
    // 바가 좁은 화면에서 두 줄이 되어도 앱이 바에 가리지 않게
    new ResizeObserver(() => document.documentElement.style.setProperty(
      "--auth-bar-h", `${$("auth-bar").offsetHeight}px`)).observe($("auth-bar"));

    const sessionData = (s) => JSON.stringify(s ? {
      url: SUPABASE_URL, key: SUPABASE_KEY, user_id: s.user.id, email: s.user.email ?? "",
      access_token: s.access_token, expires_at: s.expires_at,
    } : {});

    // ── 로그인 · 가입 창 ──
    const STEPS = ["step-login", "step-signup", "step-code", "step-setpw"];
    const TITLE = { "step-login": "로그인", "step-signup": "회원가입", "step-code": "메일 코드", "step-setpw": "비밀번호 정하기" };
    let codeEmail = "";
    function msg(text, err = false) { $("sheet-msg").textContent = text; $("sheet-msg").className = err ? "err" : ""; }
    function step(name, { tabs = true } = {}) {
      STEPS.forEach((id) => { $(id).hidden = id !== name; });
      $("sheet-tabs").hidden = !tabs;
      document.querySelectorAll("#sheet-tabs button").forEach((b) => b.classList.toggle("on", `step-${b.dataset.tab}` === name));
      $("sheet-title").textContent = TITLE[name];
      msg("");
    }
    function openSheet(name = "step-login", opts) { $("auth-sheet").hidden = false; step(name, opts); }
    function closeSheet() { $("auth-sheet").hidden = true; }
    $("auth-open").onclick = () => openSheet("step-login");
    $("sheet-close").onclick = closeSheet;
    $("auth-sheet").addEventListener("click", (e) => { if (e.target.id === "auth-sheet") closeSheet(); });
    document.querySelectorAll("#sheet-tabs button").forEach((b) => b.onclick = () => step(`step-${b.dataset.tab}`));

    function showAuth(session) {
      $("auth-status").textContent = session ? `${session.user.email}` : "로그인하면 기록이 저장돼요";
      $("auth-open").hidden = !!session;
      $("auth-logout").hidden = !session;
      $("auth-setpw").hidden = !session;
      // 코드로 처음 들어왔거나 비밀번호 재설정 메일로 돌아오면 바로 비밀번호 정하기
      if (session && (new URLSearchParams(location.search).has("reset") || sessionStorage.getItem("askPassword"))) {
        sessionStorage.removeItem("askPassword");
        openSheet("step-setpw", { tabs: false });
      }
    }
    const redirect = location.origin + location.pathname;

    // 메일 링크로 돌아온 경우 주소에 담긴 로그인 정보를 여기서 처리한다
    const { data: { session } } = await supabase.auth.getSession();
    showAuth(session);

    const KO = { "Invalid login credentials": "이메일 또는 비밀번호가 맞지 않아요. 비밀번호를 정한 적이 없으면 아래 [메일 코드로 로그인]을 눌러 주세요.",
                 "Email not confirmed": "가입 확인이 아직이에요. [회원가입]에서 같은 이메일로 다시 가입하면 확인 코드를 다시 보내요.",
                 "User already registered": "이미 가입된 이메일이에요. [로그인] 또는 [메일 코드로]를 써 주세요.",
                 "Signups not allowed for otp": "새 가입이 막혀 있어요. 관리자에게 알려 주세요.",
                 "Token has expired or is invalid": "코드가 틀렸거나 시간이 지났어요. ← 를 눌러 코드를 다시 받아 주세요.",
                 "Password should be at least 6 characters.": "비밀번호는 6자 이상이어야 해요." };
    // 같은 메일을 너무 자주 요청하면 Supabase가 잠시 막는다 (예: "For security purposes, you can only request this after 37 seconds.")
    const wait = (m) => (m.match(/after (\d+) seconds/) || [])[1];
    const say = (error) => { const w = wait(error.message);
      msg(w ? `${w}초 뒤에 다시 눌러 주세요 (같은 메일을 너무 자주 보낼 수 없어요).` : (KO[error.message] ?? error.message), true); };

    // 로그인: 이메일 + 비밀번호
    $("step-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      msg("로그인 중…");
      const { error } = await supabase.auth.signInWithPassword({ email: $("in-email").value.trim(), password: $("in-password").value });
      if (error) say(error);
    });
    // 회원가입: 이메일 + 비밀번호 → 확인 메일 한 번
    $("step-signup").addEventListener("submit", async (e) => {
      e.preventDefault();
      msg("가입 중…");
      const { data, error } = await supabase.auth.signUp({
        email: $("up-email").value.trim(), password: $("up-password").value, options: { emailRedirectTo: redirect } });
      if (error) return say(error);
      if (data.user && data.user.identities && data.user.identities.length === 0) return say({ message: "User already registered" });
      if (data.session) return msg("가입했어요.");
      // 가입 확인도 링크 대신 코드로: 메일의 숫자 코드를 넣으면 가입 끝 (비밀번호는 이미 정했으니 다시 묻지 않음)
      codeEmail = $("up-email").value.trim();
      step("step-code", { tabs: false });
      $("code-note").textContent = `${codeEmail}로 보낸 가입 확인 코드를 넣어 주세요. 한 번만 하면 돼요.`;
      $("in-code").focus();
    });
    // 메일 코드로 가입·로그인 (비밀번호 없이 / 잊었을 때) → 들어오면 비밀번호 정하기
    async function sendCode(emailInput) {
      const email = $(emailInput).value.trim();
      if (!email) { msg("이메일을 먼저 넣어 주세요.", true); $(emailInput).focus(); return; }
      msg("보내는 중…");
      sessionStorage.setItem("askPassword", "1");
      const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: redirect + "?reset=1" } });
      if (error) { sessionStorage.removeItem("askPassword"); return say(error); }
      codeEmail = email;
      step("step-code", { tabs: false });
      $("code-note").textContent = `${email}로 보낸 숫자 코드를 넣어 주세요.`;
      $("in-code").focus();
    }
    $("go-code-login").onclick = () => sendCode("in-email");
    $("go-code-signup").onclick = () => sendCode("up-email");
    $("code-back").onclick = () => step("step-login");
    $("step-code").addEventListener("submit", async (e) => {
      e.preventDefault();
      msg("확인 중…");
      const { error } = await supabase.auth.verifyOtp({ email: codeEmail, token: $("in-code").value.trim(), type: "email" });
      if (error) say(error);
    });
    // 비밀번호 정하기·바꾸기 (로그인한 상태)
    $("auth-setpw").onclick = () => openSheet("step-setpw", { tabs: false });
    $("setpw-later").onclick = closeSheet;
    $("step-setpw").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { error } = await supabase.auth.updateUser({ password: $("in-newpw").value });
      if (error) return say(error);
      $("in-newpw").value = "";
      if (location.search.includes("reset")) history.replaceState(null, "", location.pathname);
      closeSheet();
      $("auth-msg").textContent = "비밀번호를 저장했어요. 다음부터는 이메일 + 비밀번호로 로그인해요.";
    });
    $("auth-logout").addEventListener("click", async () => {
      await removeThisDevice();   // 로그아웃한 기기로는 알림을 보내지 않게
      supabase.auth.signOut();
    });

    // ── 알림 (Step 4-5): 이 기기를 알림 받을 기기로 등록 ──
    // 서버(send-push)가 이 공개 키로 서명한 알림만 이 기기가 받는다. 비밀 키는 서버에만 있다.
    const VAPID_PUBLIC_KEY = "BBc1naBjXI25fPC_0StoymAffFsflFIx8ltaYZnCsgzlH2va1FBHgBt6r39OcbAwV41QkHOAK3dlfKqdeZrAsYk";
    const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const swReady = pushSupported ? navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready)
                                  : null;

    const keyBytes = (b64) => {
      const raw = atob((b64 + "=".repeat((4 - b64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from(raw, (c) => c.charCodeAt(0));
    };

    async function saveSubscription(sub) {
      const j = sub.toJSON();
      const { error } = await supabase.from("push_subscriptions").upsert(
        { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent },
        { onConflict: "endpoint" });
      if (error) throw error;
    }

    async function removeThisDevice() {
      if (!swReady) return;
      const sub = await (await swReady).pushManager.getSubscription();
      if (sub) await supabase.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
    }

    async function showPush(session) {
      const btn = $("push-btn");
      btn.hidden = !session;
      if (!session) return;
      if (!pushSupported) {
        btn.textContent = isIOS ? "알림 받는 법" : "이 브라우저는 알림 불가";
        return;
      }
      if (Notification.permission === "denied") { btn.textContent = "알림 차단됨"; return; }
      const sub = await (await swReady).pushManager.getSubscription();
      if (sub) {
        btn.textContent = "알림 켜짐";
        saveSubscription(sub).catch(() => {});   // 다른 계정으로 바뀌었거나 서버에서 지워졌을 때 다시 등록
      } else {
        btn.textContent = "알림 켜기";
      }
    }

    $("push-btn").addEventListener("click", async () => {
      if (!pushSupported) {
        $("auth-msg").textContent = isIOS
          ? "아이폰: 사파리 아래 [공유] → [홈 화면에 추가] → 홈 화면의 '카페인' 앱을 열고 로그인한 뒤 여기서 알림을 켜 주세요 (iOS 16.4 이상)."
          : "이 브라우저는 알림을 지원하지 않아요. 크롬이나 사파리 최신 버전에서 열어 주세요.";
        return;
      }
      if (Notification.permission === "denied") {
        $("auth-msg").textContent = "알림이 차단돼 있어요. 주소창 왼쪽 자물쇠(또는 설정) → 알림 → 허용으로 바꾼 뒤 새로고침해 주세요.";
        return;
      }
      try {
        $("auth-msg").textContent = "알림 허용을 물어보면 [허용]을 눌러 주세요…";
        if (await Notification.requestPermission() !== "granted") {
          $("auth-msg").textContent = "알림이 허용되지 않았어요.";
          return showPush(session);
        }
        const reg = await swReady;
        const sub = await reg.pushManager.getSubscription()
          || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(VAPID_PUBLIC_KEY) });
        await saveSubscription(sub);
        $("auth-msg").textContent = "이 기기에서 알림을 받을 수 있어요. 추천 화면에서 「1분 뒤 테스트 알림」으로 확인해 보세요.";
      } catch (e) {
        $("auth-msg").textContent = `알림을 켜지 못했어요: ${e.message ?? e}`;
      }
      showPush(session);
    });
    showPush(session);

    // 저장소의 파일을 그대로 가져와 브라우저 속 Python에 넣는다.
    // 파일을 추가하면 이 목록에도 추가할 것 (tests/test_pages.py가 빠진 파일을 잡아낸다)
    const FILES = [
      "app/streamlit_app.py",
      "app/state.py",
      "app/page_plan.py",
      "app/page_day.py",
      "app/page_profile.py",
      "app/calendar_view.py",
      "app/report.py",
      "app/page_report.py",
      "app/page_drinks.py",
      "app/page_feedback.py",
      "app/tabbar.py",
      "app/timer_view.py",
      "app/report_cards.py",
      "app/theme.py",
      "app/dial.py",
      "app/components/dial/index.html",
      "app/forms.py",
      "app/charts.py",
      "app/ntfy.py",
      "app/account.py",
      "app/store.py",
      "caffeine_engine/__init__.py",
      "caffeine_engine/params.py",
      "caffeine_engine/timeutil.py",
      "caffeine_engine/pk.py",
      "caffeine_engine/fatigue.py",
      "caffeine_engine/effect.py",
      "caffeine_engine/optimizer.py",
      "caffeine_engine/profile.py",
      "caffeine_engine/convert.py",
      "caffeine_engine/metrics.py",
      "caffeine_engine/pipeline.py",
      "caffeine_engine/scenario.py",
      "caffeine_engine/notify.py",
      "caffeine_engine/calibration.py",
      "parameters.yaml",
      "beverages.yaml",
      "scenarios/exam_day.yaml",
      "scenarios/late_night.yaml",
      "scenarios/pregnant_sensitive.yaml",
      "scenarios/smoker_early_shift.yaml",
    ];

    const app = mount(
      {
        requirements: ["pyyaml"],
        entrypoint: "app/streamlit_app.py",
        files: {
          // ?v=… : 브라우저가 예전 파일을 기억해 두고 쓰지 않게 매번 새로 받는다 (파일이 작아 부담 없음)
          ...Object.fromEntries(FILES.map((path) => [path, { url: `${path}?v=${Date.now()}` }])),
          [SESSION_FILE]: { data: sessionData(session) },
        },
        // 개발자용 Deploy 버튼 숨김. 강조색(초록)은 app/theme.py의 CSS로 — 테마 설정을 넣으면 다크/라이트 선택이 무시됨
        streamlitConfig: { "client.toolbarMode": "viewer" },
      },
      document.getElementById("root"),
    );

    // 로그인·로그아웃은 화면을 새로 열어 Python이 처음부터 새 상태로 시작하게 하고,
    // 1시간마다 오는 열쇠 갱신은 파일만 다시 써준다 (Python은 다음 화면 갱신 때 새 열쇠를 읽음)
    supabase.auth.onAuthStateChange((event, s) => {
      if (event === "SIGNED_IN" && !session) location.reload();
      else if (event === "SIGNED_OUT") location.reload();
      else if (event === "TOKEN_REFRESHED") app.writeFile(SESSION_FILE, sessionData(s));
    });
  </script>
</body>
</html>
